name: hermes-mail
repo: https://github.com/rot13maxi/hermes-mail
sha: cdff98773f3578aba4a3147e6f3c07a9f399a2ef
description: SQLite-backed agent-to-agent mailbox for concurrent Hermes sessions on one machine — mail_send/mail_read/mail_reply/mail_peek/mail_who over a shared WAL database (no daemon, no network), optional turn-boundary injection hook (pre_llm_call) and signed webhook push to wake gateway sessions. Untrusted-peer trust framing and loop protection built in.
maintainer: rijndael
tier: community
category: tools
docs_url: https://github.com/rot13maxi/hermes-mail#readme
platforms: []
capabilities:
  provides_tools:
    - mail_send
    - mail_read
    - mail_reply
    - mail_peek
    - mail_who
  provides_hooks:
    - pre_llm_call
  provides_middleware: []
  requires_env: []
